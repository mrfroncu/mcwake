# Gives the orchestrator a leg on the home LAN so its Wake-on-LAN broadcast
# reaches the game host. From the default bridge, a packet to the LAN
# broadcast address is delivered to this Docker host itself and never leaves.
#
# Enable it in .env, so a plain `docker compose up -d` keeps using it:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.lan-wol.yml
#   WOL_LAN_ADDRESS=<free fixed LAN address for the orchestrator>
#   WOL_LAN_NETWORK=br0   # an existing ipvlan/macvlan network on this host
#
# The LAN route only covers the LAN: talking to the game host, Wings and the
# Tapo plug goes out this way, from WOL_LAN_ADDRESS. On ipvlan/macvlan the
# Docker host itself is unreachable through it, which nothing here needs.
services:
  orchestrator:
    networks:
      mcwake:
        # The default route stays on the bridge: lazymc and the dashboard come
        # in through the published port, and replies must leave the same way.
        gw_priority: 1
      lan:
        ipv4_address: ${WOL_LAN_ADDRESS:?set WOL_LAN_ADDRESS in .env}

networks:
  lan:
    name: ${WOL_LAN_NETWORK:-br0}
    external: true
