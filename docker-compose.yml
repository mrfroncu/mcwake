# mcwake on the home server: the orchestrator, alone. lazymc runs on a VPS
# (docker-compose.vps.yml) and the management panel lives in the dashboard.
services:
  orchestrator:
    build:
      context: orchestrator
      # Fetch the current node base before each build instead of reusing a
      # weeks-old local copy.
      pull: true
    restart: unless-stopped
    env_file: .env
    environment:
      - LOG_FILE=/data/logs/orchestrator.log
    ports:
      # Reached by lazymc on the VPS and by the dashboard, over Tailscale:
      # bind it to this host's Tailscale IP (localhost-only if unset).
      - "${ORCHESTRATOR_BIND_ADDRESS:-127.0.0.1}:${ORCHESTRATOR_PORT:-7100}:${ORCHESTRATOR_PORT:-7100}"
    volumes:
      - mcwake-data:/data
    networks:
      mcwake:
        # The default route stays on the bridge: lazymc and the dashboard come
        # in through the published port, and replies must leave the same way.
        gw_priority: 1
      lan:
        # A leg on the home LAN, for Wake-on-LAN: from the bridge, a packet to
        # the LAN broadcast address is delivered to this Docker host itself and
        # never reaches the game host. The API refuses connections arriving on
        # this address (src/index.ts).
        ipv4_address: ${WOL_LAN_ADDRESS:?set WOL_LAN_ADDRESS in .env}
    # Nothing in here needs a capability, a writable image or root.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:7100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  mcwake:
    driver: bridge
  lan:
    # An existing ipvlan/macvlan network on this host (br0 on Unraid).
    name: ${WOL_LAN_NETWORK:-br0}
    external: true

volumes:
  mcwake-data:
