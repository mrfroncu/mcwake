services:
  lazymc:
    build:
      context: .
      dockerfile: lazymc/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PUBLIC_PORT:-25565}:${PUBLIC_PORT:-25565}"
    depends_on:
      - orchestrator
    networks:
      - mcwake

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - LOG_FILE=/data/logs/orchestrator.log
    volumes:
      - mcwake-data:/data
      # Lets the panel's "restart lazymc" button (Konfiguracja section) apply
      # settings that lazymc only re-reads at container start. This grants
      # full control over every container on this Docker host, not just
      # mcwake's own — comment this line out if you'd rather apply those
      # settings manually via `docker compose restart lazymc` instead.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - mcwake
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:7100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  idle-reaper:
    build:
      context: .
      dockerfile: services/idle-reaper/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - LOG_FILE=/data/logs/idle-reaper.log
    volumes:
      - mcwake-data:/data
    depends_on:
      - orchestrator
    networks:
      - mcwake

  web:
    build:
      context: .
      dockerfile: services/web/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "${WEB_PORT:-8080}:${WEB_PORT:-8080}"
    depends_on:
      - orchestrator
    networks:
      - mcwake

networks:
  mcwake:
    driver: bridge

volumes:
  mcwake-data:
